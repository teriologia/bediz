<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bediz</title>
  <style>
    :root { --bg: #17181c; --panel: #1e1f25; --line: #2d2f38; --text: #d8d9de; --dim: #8a8d99; --accent: #4cc2ff; --ok: #4ade80; --bad: #f87171; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
    body { display: grid; grid-template-columns: 250px 1fr 310px; grid-template-rows: 42px 1fr; grid-template-areas: "top top top" "side stage panel"; }
    #top { grid-area: top; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
    #top b { font-size: 15px; letter-spacing: .3px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); display: inline-block; }
    .dot.ok { background: var(--ok); }
    #top label { display: flex; gap: 6px; align-items: center; color: var(--dim); cursor: pointer; }
    #spacer { flex: 1; }
    #info { color: var(--dim); }
    aside { background: var(--panel); overflow: auto; }
    #side { grid-area: side; border-right: 1px solid var(--line); }
    #panel { grid-area: panel; border-left: 1px solid var(--line); padding: 10px 12px; }
    h3 { margin: 12px 12px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--dim); }
    ul { list-style: none; margin: 0; padding: 0; }
    #side li { display: flex; align-items: center; gap: 8px; padding: 6px 12px; cursor: pointer; border-left: 3px solid transparent; }
    #side li:hover { background: #262830; }
    #side li.on { background: #23303a; border-left-color: var(--accent); }
    #side li small { margin-left: auto; color: var(--dim); }
    .badge { font-size: 10px; padding: 1px 6px; border-radius: 8px; background: #2d2f38; color: var(--dim); }
    .empty { padding: 6px 12px; color: var(--dim); }
    #stage { grid-area: stage; position: relative; overflow: hidden; cursor: grab; background-color: #1a1b1f;
      background-image: linear-gradient(45deg, #22242a 25%, transparent 25%), linear-gradient(-45deg, #22242a 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #22242a 75%), linear-gradient(-45deg, transparent 75%, #22242a 75%);
      background-size: 24px 24px; background-position: 0 0, 0 12px, 12px -12px, -12px 0; }
    #stage.drag { cursor: grabbing; }
    #stage canvas { display: block; }
    #toolbar { position: absolute; left: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 6px 10px; background: rgba(30, 31, 37, .92); border: 1px solid var(--line); border-radius: 8px; z-index: 2; max-width: calc(100% - 20px); }
    #toolbar label { display: flex; gap: 6px; align-items: center; color: var(--dim); }
    #toolbar input[type=range] { width: 120px; }
    #toolbar button, #toolbar select { background: #2a2c35; color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 3px 9px; font: inherit; cursor: pointer; }
    #toolbar button:hover { border-color: var(--accent); }
    .hide { display: none !important; }
    @media (max-width: 980px) { body { grid-template-columns: 200px 1fr; grid-template-areas: "top top" "side stage"; } #panel { display: none; } }
    #hint { position: absolute; left: 10px; bottom: 10px; padding: 4px 9px; background: rgba(30, 31, 37, .92); border: 1px solid var(--line); border-radius: 6px; color: var(--dim); z-index: 2; pointer-events: none; }
    #empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); pointer-events: none; text-align: center; padding: 30px; }
    #panel h4 { margin: 0 0 6px; font-size: 14px; }
    #panel .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; color: var(--dim); margin-bottom: 10px; }
    #panel .kv span:nth-child(even) { color: var(--text); }
    #panel li { display: flex; gap: 6px; align-items: baseline; padding: 3px 4px; border-radius: 4px; cursor: default; }
    #panel li:hover, #panel li.on { background: #262d38; }
    #panel li.off { opacity: .45; }
    #panel li small { color: var(--dim); }
    #panel .tree li { cursor: pointer; }
  </style>
</head>
<body>
  <header id="top">
    <b>Bediz</b>
    <span><span class="dot" id="dot"></span> <span id="status" style="color:var(--dim)">bağlanıyor…</span></span>
    <label title="AI bir tasarım/widget değiştirince otomatik göster"><input type="checkbox" id="follow" checked /> Son değişikliği izle</label>
    <span id="spacer"></span><span id="info"></span>
  </header>
  <aside id="side"><h3>Tasarımlar</h3><ul id="designs"></ul><h3>Widget'lar</h3><ul id="widgets"></ul></aside>
  <main id="stage">
    <div id="toolbar" class="hide">
      <label id="modeBox">Görünüm <select id="mode"></select></label>
      <label id="swBox">Genişlik <input id="sw" type="range" min="16" max="1200" value="300" /><output id="swv"></output></label>
      <label id="shBox">Yükseklik <input id="sh" type="range" min="16" max="800" value="200" /><output id="shv"></output></label>
      <label id="gridBox"><input type="checkbox" id="grid" /> <span id="gridLabel">Kılavuz</span></label>
      <button id="fit" title="F">Sığdır</button><button id="one" title="1">1:1</button><span id="zoomv" style="color:var(--dim)"></span>
    </div>
    <div id="empty"><div>Henüz bir şey yok.<br />Claude'dan <b>create_container</b>, <b>create_button</b> gibi bir tool çağırmasını iste; burada canlı görünür.</div></div>
    <div id="hint" class="hide"></div>
  </main>
  <aside id="panel"></aside>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
